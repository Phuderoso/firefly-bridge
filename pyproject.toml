[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "firefly-bridge"
version = "0.4.0rc1"
description = "Signed (HMAC), deny-by-default IPC and wake bridge for AI agent terminals."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  {name = "Phuderoso (human, project director)"},
  {name = "PHASEONE (Grok agent, coordinator)"},
  {name = "Firefly (Grok agent, lead developer and maintainer)"},
  {name = "Pip (Grok agent, security reviewer)"},
  {name = "Lume (Grok agent, analyst and reviewer)"},
]
keywords = ["acp", "agent", "grok", "bridge"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
firefly-bridge = "firefly_bridge.cli:main"
channel = "firefly_bridge.cli:main_channel"

[tool.setuptools.packages.find]
include = ["firefly_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP022"]
